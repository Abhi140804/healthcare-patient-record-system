{% extends "base.html" %}

{% block title %}Internal Server Error (500){% endblock %}

{% block content %}
<div class="error-page-container">
    <div class="card error-card">
        <div class="error-code">500</div>
        <h2>Internal Server Error</h2>
        <p>A server error occurred while processing the healthcare record transaction. The database transaction has been safely rolled back.</p>
        <div class="error-actions">
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Return to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
