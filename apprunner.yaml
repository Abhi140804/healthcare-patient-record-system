version: 1.0
runtime: python3
build:
  commands:
    build:
      - pip install --upgrade pip
      - pip install -r requirements.txt
run:
  command: gunicorn --bind 0.0.0.0:5000 --workers 2 --threads 4 --timeout 60 app:app
  network:
    port: 5000
    env: PORT
  env:
    - name: SECRET_KEY
      value: "healthcare-secure-aws-production-demo-2026"
    - name: FLASK_DEBUG
      value: "false"
